services:
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    restart: unless-stopped
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      COOKIE_SECURE: ${COOKIE_SECURE}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173"]}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      ASK_DOCS_EMBEDDING_MODEL: ${ASK_DOCS_EMBEDDING_MODEL:-nomic-embed-text}
      ASK_DOCS_CHUNK_SIZE_TOKENS: ${ASK_DOCS_CHUNK_SIZE_TOKENS:-1024}
      ASK_DOCS_CHUNK_OVERLAP_TOKENS: ${ASK_DOCS_CHUNK_OVERLAP_TOKENS:-128}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      ASK_DOCS_TOP_K: ${ASK_DOCS_TOP_K:-8}
      ASK_DOCS_MAX_ANSWER_TOKENS: ${ASK_DOCS_MAX_ANSWER_TOKENS:-1024}
      OC_URL: ${OC_URL:-}
      OC_TOKEN: ${OC_TOKEN:-}
      PHONE_HOME_INTERVAL_SECONDS: ${PHONE_HOME_INTERVAL_SECONDS:-300}
      PORTAL_VERSION: ${PORTAL_VERSION:-0.7.0}
    volumes:
      - portal_uploads:/app/data/uploads
    ports:
      - "${BACKEND_PORT}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      target: runtime
    environment:
      PUBLIC_API_URL: ${PUBLIC_API_URL}
    ports:
      - "${FRONTEND_PORT}:5173"
    # 127.0.0.1, not localhost — the container's /etc/hosts resolves localhost to ::1
    # first, but SvelteKit's dev server only binds IPv4 (0.0.0.0).
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy

  qdrant:
    restart: unless-stopped
    image: qdrant/qdrant:v1.13.0
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  ollama:
    restart: unless-stopped
    image: ollama/ollama:0.5.4
    volumes:
      - ollama_models:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "ollama serve &
       sleep 3
       ollama pull nomic-embed-text || echo 'ollama pull failed (will retry on first use)'
       wait"
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    restart: unless-stopped
    build:
      context: ./backend
    command: arq app.workers.worker.WorkerSettings
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      COOKIE_SECURE: ${COOKIE_SECURE}
      SQL_ECHO: ${SQL_ECHO:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173"]}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      ASK_DOCS_EMBEDDING_MODEL: ${ASK_DOCS_EMBEDDING_MODEL:-nomic-embed-text}
      ASK_DOCS_CHUNK_SIZE_TOKENS: ${ASK_DOCS_CHUNK_SIZE_TOKENS:-1024}
      ASK_DOCS_CHUNK_OVERLAP_TOKENS: ${ASK_DOCS_CHUNK_OVERLAP_TOKENS:-128}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      ASK_DOCS_TOP_K: ${ASK_DOCS_TOP_K:-8}
      ASK_DOCS_MAX_ANSWER_TOKENS: ${ASK_DOCS_MAX_ANSWER_TOKENS:-1024}
      OC_URL: ${OC_URL:-}
      OC_TOKEN: ${OC_TOKEN:-}
    volumes:
      - portal_uploads:/app/data/uploads
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      ollama: { condition: service_healthy }
    # Override the inherited backend Dockerfile HEALTHCHECK (which hits localhost:8000 — the
    # worker doesn't run uvicorn, only arq, so port 8000 is closed). arq writes a health key
    # to Redis every 60s; `arq --check` reads it and exits 0 when the worker is alive.
    healthcheck:
      test: ["CMD", "arq", "--check", "app.workers.worker.WorkerSettings"]
      interval: 30s
      # 15s timeout: `arq --check` does Python imports + Redis dial each invocation,
      # consistently runs 6-10s on this host. 5s would race the import every time.
      timeout: 15s
      start_period: 90s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  portal_uploads:
  qdrant_data:
  ollama_models:
